      tailwind.config = {
        theme: {

            colors: {
              orbit: {
                black: '#050505',
                dark: '#0a0a0a',
                gray: '#1a1a1a',
                accent: '#ffffff',
              }

            animation: {
              'fade-in-up': 'fadeInUp 0.8s ease-out forwards',
